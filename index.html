<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChipBot v4.2 - HBM Alpha</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChipBot">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2533/2533031.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10; --bg2:#13161b; --bg3:#1a1e25;
  --bdr:rgba(255,255,255,.08); --txt:#dddbd6; --muted:#6b6966;
  --green:#4ade80; --green-bg:rgba(74,222,128,.08);
  --red:#f87171; --blue:#60a5fa; --gold:#fbbf24;
  --font:'Inter', sans-serif; --mono:'JetBrains Mono', monospace;
}

html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto; background:rgba(11,13,16,0.98); backdrop-filter:blur(15px)}

/* Splash Screen */
#splash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items:center;
  z-index: 10000; transition: opacity 0.8s;
}
#splash.hidden { opacity: 0; visibility: hidden; }

/* Header */
#hdr{padding:20px 16px 12px; border-bottom:1px solid var(--bdr); flex-shrink:0; padding-top:calc(20px + env(safe-area-inset-top))}
.stabs{display:flex;gap:6px;margin-bottom:12px; overflow-x:auto; scrollbar-width:none;}
.stab{padding:6px 16px; border:1px solid var(--bdr); border-radius:4px; font-size:11px; font-weight:600; color:var(--muted); background:var(--bg2); white-space:nowrap; cursor:pointer;}
.stab.act{border-color:var(--green); color:var(--green); background:var(--green-bg)}

.h-price-wrap{display:flex; align-items:baseline; gap:10px}
.h-price{font-size:36px;font-weight:700;letter-spacing:-.04em;font-family:var(--mono)}

/* Content */
#content{flex:1;overflow-y:auto;padding:16px; scrollbar-width:none;}
#content::-webkit-scrollbar{display:none}

.die-card{
  background:var(--bg2); border:1px solid var(--bdr); border-left:4px solid var(--muted);
  border-radius:4px; padding:16px; margin-bottom:12px;
}
.die-card.highlight{border-left-color:var(--gold);}
.die-label{font-size:9px;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.die-val{font-size:24px;font-weight:700;font-family:var(--mono)}

/* ETF Table Style */
.etf-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.etf-item{background:var(--bg3); border:1px solid var(--bdr); border-radius:4px; padding:10px}
.etf-title{font-size:11px; font-weight:700; margin-bottom:6px; color:var(--blue)}
.etf-weight{font-size:10px; color:var(--muted); line-height:1.4}

/* Buttons & Input */
.savebtn{width:100%;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:4px;color:var(--green);font-weight:700;text-transform:uppercase; cursor:pointer}
#tabbar{display:flex;border-top:1px solid var(--bdr);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:18px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);border:none;background:transparent;}
.tb.act{color:var(--green); background:rgba(74,222,128,0.05)}

.screen{display:none; height:100%}.screen.act{display:block}
</style>
</head>
<body>

<div id="splash">
  <div style="width:250px; height:250px; border:2px solid var(--green); border-radius:10px; display:flex; justify-content:center; align-items:center; box-shadow:0 0 30px var(--green-bg)">
    <div style="font-family:var(--mono); color:var(--green); font-size:20px; font-weight:700; text-align:center;">HBM ALPHA<br>LOAD...</div>
  </div>
</div>

<div id="app">
  <div id="hdr">
    <div class="stabs">
      <button class="stab act" onclick="switchStock('samsung',this)">Die 0: SEC</button>
      <button class="stab" onclick="switchStock('skhynix',this)">Die 1: HYX</button>
    </div>
    <div class="h-price-wrap">
      <span id="hPrice" class="h-price">₩-</span>
    </div>
  </div>

  <div id="content">
    <div id="screen-trade" class="screen act">
      <div class="die-card"><div class="die-label">Wilder's RSI (14D)</div><div class="die-val" id="rsiV">-</div></div>
      
      <div class="die-label">HBM Ecosystem & ETF Monitoring (4/17 종가)</div>
      <div id="etf-list" class="etf-grid"></div>

      <button class="savebtn" onclick="runAI()">Execute Portfolio Strategy ↗</button>
      <div id="aiRep" style="margin-top:16px; font-size:11px; color:var(--muted); line-height:1.7; border-left:1px solid var(--bdr); padding-left:12px"></div>
    </div>

    <div id="screen-news" class="screen"><div id="news-list"></div></div>
    <div id="screen-chat" class="screen">
      <div id="chat-logs" style="height:350px; overflow-y:auto; padding:10px"></div>
      <div style="display:flex; padding:10px; background:var(--bg2); gap:10px; border-radius:4px">
        <input type="text" id="chat-input" style="flex:1; background:transparent; border:none; color:#fff; outline:none" placeholder="질문하기..." onkeypress="if(event.keyCode==13) sendChat()">
        <button onclick="sendChat()" style="background:none; border:none; color:var(--green); font-weight:700">SEND</button>
      </div>
    </div>
    <div id="screen-set" class="screen">
      <div class="die-card"><div class="die-label">Gemini API Key</div><input type="password" id="geminiKey" class="savebtn" style="background:var(--bg3); text-align:left; color:#fff"></div>
      <button class="savebtn" onclick="saveAll()">Flash Memory Save</button>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb act" onclick="switchTab('trade',this)">MONITOR</button>
    <button class="tb" onclick="switchTab('news',this)">NEWS</button>
    <button class="tb" onclick="switchTab('chat',this)">CHAT</button>
    <button class="tb" onclick="switchTab('set',this)">SYS</button>
  </div>
</div>

<script>
/* ── [반영] 2026.04.17. 실제 종가 및 ETF 데이터 ── */
const STOCKS = {
  samsung: { name:'삼성전자', lastClose: 218000, prevClose: 216000 },
  skhynix: { name:'SK하이닉스', lastClose: 1144000, prevClose: 1128000 }
};

const ETFS = [
  { name: 'KODEX 200', price: 89500, sec: '32.2%', hyx: '20.0%', info: '코스피 지수 추종, 가장 안정적' },
  { name: 'KODEX 반도체', price: 45300, sec: '0%', hyx: '28.5%', info: '소부장 위주, 삼전 제외' },
  { name: 'TIGER 코리아TOP10', price: 13400, sec: '24.8%', hyx: '29.6%', info: '대형주 압축, 집중도 최고' },
  { name: 'UNICORN SK하이닉스', price: 14200, sec: '0%', hyx: '24.3%', info: '하이닉스 밸류체인 액티브' },
  { name: 'RISE 삼전하닉채권50', price: 10580, sec: '25.0%', hyx: '25.0%', info: '채권 50% 혼합, 연금 추천' }
];

let cur = 'samsung', pH = {samsung:[], skhynix:[]}, pChart;

function calcRSI(p, n=14){
  if(p.length < n+1) return 50;
  let g=[], l=[]; for(let i=1;i<p.length;i++){ const d=p[i]-p[i-1]; g.push(d>0?d:0); l.push(d<0?-d:0); }
  let ag=g.slice(0,n).reduce((a,b)=>a+b)/n, al=l.slice(0,n).reduce((a,b)=>a+b)/n;
  for(let i=n;i<g.length;i++){ ag=(ag*(n-1)+g[i])/n; al=(al*(n-1)+l[i])/n; }
  return al===0?100:parseFloat((100-(100/(1+ag/al))).toFixed(1));
}

function updateETFUI() {
  const list = document.getElementById('etf-list');
  list.innerHTML = ETFS.map(e => `
    <div class="etf-item">
      <div class="etf-title">${e.name}</div>
      <div style="font-size:14px; font-weight:700; margin-bottom:5px">₩${e.price.toLocaleString()}</div>
      <div class="etf-weight">SEC: ${e.sec} / HYX: ${e.hyx}</div>
      <div style="font-size:9px; color:var(--hint); margin-top:4px">${e.info}</div>
    </div>
  `).join('');
}

async function runAI() {
  const k = localStorage.getItem('gemini_key');
  if(!k) { document.getElementById('aiRep').textContent = "API 키를 설정해 주세요."; return; }
  
  const prompt = `현재 삼성전자 ₩218,000, SK하이닉스 ₩1,144,000입니다. 
  로지님에게 다음 상품 중 하나를 추천하고 이유를 설명하세요: 
  1. KODEX 200 (시장 분산)
  2. TIGER 코리아TOP10 (삼전/하닉 비중 54% 집중)
  3. RISE 삼성전자SK하이닉스채권혼합50 (변동성 관리)
  4. UNICORN SK하이닉스 (하이닉스 올인)
  현재 하이닉스 RSI는 ${calcRSI(pH.skhynix)}입니다.`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
  });
  const data = await res.json();
  document.getElementById('aiRep').textContent = data.candidates[0].content.parts[0].text;
}

function switchStock(k,b){ document.querySelectorAll('.stab').forEach(s=>s.classList.remove('act')); b.classList.add('act'); cur=k; updateUI(); }
function switchTab(i,b){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('act')); document.querySelectorAll('.tb').forEach(t=>t.classList.remove('act')); document.getElementById('screen-'+i).classList.add('act'); b.classList.add('act'); }

function updateUI(){
  const s = STOCKS[cur]; document.getElementById('hPrice').textContent=`₩${s.lastClose.toLocaleString()}`;
  document.getElementById('rsiV').textContent = calcRSI(pH[cur]);
}

function saveAll(){ localStorage.setItem('gemini_key', document.getElementById('geminiKey').value); alert('저장 완료'); }

function init(){
  ['samsung','skhynix'].forEach(k=>{
    let v = STOCKS[k].prevClose; for(let i=0;i<30;i++){ v+=(Math.random()-0.5)*2000; pH[k].push(Math.round(v)); }
    pH[k][pH[k].length-1] = STOCKS[k].lastClose;
  });
  updateUI(); updateETFUI();
  document.getElementById('geminiKey').value=localStorage.getItem('gemini_key')||"";
  setTimeout(() => document.getElementById('splash').classList.add('hidden'), 2500);
}
init();
</script>
</body>
</html>
