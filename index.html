<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChipBot v4.0 - HBM Die Edition</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChipBot">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2533/2533031.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10; /* 실리콘 베이스 다크 */
  --bg2:#13161b; /* 다이(Die) 레이어 */
  --bg3:#1a1e25; /* 서킷 보드 레이어 */
  --bdr:rgba(255,255,255,.08);
  --bdr-neon:rgba(74,222,128,.3);
  --txt:#dddbd6;
  --muted:#6b6966;
  --green:#4ade80; /* 전도성 그린 */
  --green-bg:rgba(74,222,128,.08);
  --red:#f87171;
  --blue:#60a5fa; /* 시그널 블루 */
  --font:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;
}

html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;overflow:hidden;}

/* 배경 회로 패턴 효과 */
body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(var(--bdr) 1px, transparent 1px);
  background-size: 20px 20px; z-index: -1; opacity: 0.5;
}

#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto; background:rgba(11,13,16,0.95); backdrop-filter:blur(10px)}

/* HBM 스택 헤더 */
#hdr{padding:20px 16px 12px; border-bottom:1px solid var(--bdr); flex-shrink:0; padding-top:calc(20px + env(safe-area-inset-top))}
.stabs{display:flex;gap:8px;margin-bottom:12px}
.stab{padding:6px 16px;border:1px solid var(--bdr);border-radius:4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg2);cursor:pointer;transition:0.2s;text-transform:uppercase;letter-spacing:1px}
.stab.act{border-color:var(--green);color:var(--green);box-shadow:0 0 10px var(--green-bg)}

.h-price-wrap{display:flex; align-items:baseline; gap:10px}
.h-price{font-size:36px;font-weight:700;letter-spacing:-.04em;font-family:var(--mono)}
.h-chg{font-size:14px;font-weight:600}

/* HBM Die 모듈형 콘텐츠 */
#content{flex:1;overflow-y:auto;padding:16px; scrollbar-width:none;}
#content::-webkit-scrollbar{display:none}

.die-card{
  background:var(--bg2); border:1px solid var(--bdr); border-left:4px solid var(--muted);
  border-radius:4px; padding:16px; margin-bottom:12px; position:relative;
  box-shadow:4px 4px 0px rgba(0,0,0,0.3);
}
.die-card.active-node{border-left-color:var(--green); box-shadow:0 0 15px rgba(74,222,128,0.1)}
.die-label{font-size:9px;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.die-val{font-size:24px;font-weight:700;font-family:var(--mono)}

/* 뉴스 스택 스타일 */
.n-stack{background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:12px;margin-bottom:10px; border-right:2px solid var(--bdr)}
.n-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:2px;margin-bottom:6px;display:inline-block}
.tag-pos{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.n-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:4px}

/* 채팅 인터페이스 */
#chat-logs{height:350px;overflow-y:auto;margin-bottom:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px;border-radius:4px;font-size:12px;line-height:1.6;position:relative}
.msg.ai{background:var(--bg2);color:var(--txt);align-self:flex-start;border:1px solid var(--bdr)}
.msg.user{background:var(--green-bg);color:var(--green);align-self:flex-end;border:1px solid var(--green-bd);border-right:4px solid var(--green)}

#chat-input-area{display:flex;gap:10px;background:var(--bg2);padding:12px;border-radius:4px;border:1px solid var(--bdr)}
#chat-input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:13px;font-family:var(--mono)}

/* 하단 내비게이션 (Bus Interface) */
#tabbar{display:flex;border-top:1px solid var(--bdr);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:18px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);border:none;background:transparent;letter-spacing:0.05em}
.tb.act{color:var(--green);background:linear-gradient(to top, var(--green-bg), transparent)}

.savebtn{width:100%;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:4px;color:var(--green);font-weight:700;cursor:pointer;font-family:var(--mono);text-transform:uppercase}
.apii{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;color:#fff;padding:14px;margin-top:10px;outline:none;font-family:var(--mono)}

.screen{display:none; height:100%}.screen.act{display:block}
</style>
</head>
<body>

<div id="app">
  <div id="hdr">
    <div class="stabs">
      <button class="stab act" onclick="switchStock('samsung',this)">Die 0: SEC</button>
      <button class="stab" onclick="switchStock('skhynix',this)">Die 1: HYX</button>
    </div>
    <div class="h-price-wrap">
      <span id="hPrice" class="h-price">₩-</span>
      <span id="hChg" class="h-chg">-%</span>
    </div>
  </div>

  <div id="content">
    <div id="screen-trade" class="screen act">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px">
        <div class="die-card active-node"><div class="die-label">Wilder's RSI</div><div class="die-val" id="rsiV">-</div></div>
        <div class="die-card"><div class="die-label">Signal Node</div><div class="die-val" id="sigNode" style="font-size:14px; color:var(--blue)">STANDBY</div></div>
      </div>
      <div class="die-card"><div class="die-label">Stack Monitoring (30D)</div><div style="height:180px"><canvas id="pc"></canvas></div></div>
      <button class="savebtn" onclick="runAI()">Execute Gemini Analysis ↗</button>
      <div id="aiRep" style="margin-top:16px; font-size:11px; color:var(--muted); line-height:1.7; border-left:1px solid var(--bdr); padding-left:12px"></div>
    </div>

    <div id="screen-news" class="screen">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
        <span style="font-weight:700; letter-spacing:0.1em">DATA BUS: NEWS</span>
        <button onclick="loadDailyNews()" style="font-size:10px; color:var(--blue); background:none; border:none; font-family:var(--mono)">REFRESH</button>
      </div>
      <div id="news-list"></div>
    </div>

    <div id="screen-chat" class="screen">
      <div id="chat-logs"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Enter signal request..." onkeypress="if(event.keyCode==13) sendChat()">
        <button onclick="sendChat()" style="color:var(--green);background:none;border:none;font-weight:700">SEND</button>
      </div>
    </div>

    <div id="screen-set" class="screen">
      <div class="die-card"><div class="die-label">Gemini API Controller</div><input class="apii" type="password" id="geminiKey"></div>
      <div class="die-card"><div class="die-label">Notion Integration</div><input class="apii" type="password" id="notionKey" placeholder="Secret Key"><input class="apii" type="text" id="notionDbId" placeholder="Database ID" style="margin-top:8px"></div>
      <button class="savebtn" onclick="saveAll()">Flash Memory Save</button>
      <div style="text-align:center; padding:30px; font-size:10px; color:var(--muted); font-family:var(--mono)">CHIPBOT v4.0 PRO | HBM DIE EDITION</div>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb act" onclick="switchTab('trade',this)">CORE</button>
    <button class="tb" onclick="switchTab('news',this)">NEWS</button>
    <button class="tb" onclick="switchTab('chat',this)">CHAT</button>
    <button class="tb" onclick="switchTab('set',this)">SYS</button>
  </div>
</div>
