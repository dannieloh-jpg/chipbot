<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChipBot v5.6 - Robust AI</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10; --bg2:#13161b; --bg3:#1a1e25;
  --bdr:rgba(255,255,255,.08); --txt:#dddbd6; --muted:#6b6966;
  --green:#4ade80; --green-bg:rgba(74,222,128,.1);
  --red:#f87171; --blue:#60a5fa; --gold:#fbbf24;
  --font:'Inter', sans-serif; --mono:'JetBrains Mono', monospace;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto; background:rgba(11,13,16,0.98); backdrop-filter:blur(15px)}
#hdr{padding:20px 16px 12px; border-bottom:1px solid var(--bdr); padding-top:calc(20px + env(safe-area-inset-top))}
.stabs{display:flex;gap:6px;margin-bottom:12px; overflow-x:auto; scrollbar-width:none;}
.stab{padding:6px 16px; border:1px solid var(--bdr); border-radius:4px; font-size:11px; font-weight:600; color:var(--muted); background:var(--bg2); cursor:pointer; white-space:nowrap;}
.stab.act{border-color:var(--green); color:var(--green); background:var(--green-bg)}
.h-price{font-size:36px;font-weight:700;letter-spacing:-.04em;font-family:var(--mono); cursor:pointer}
#content{flex:1;overflow-y:auto;padding:16px; scrollbar-width:none;}
#content::-webkit-scrollbar{display:none}
.die-card{background:var(--bg2); border:1px solid var(--bdr); border-left:4px solid var(--muted); border-radius:4px; padding:16px; margin-bottom:12px;}
.etf-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.etf-item{background:var(--bg3); border:1px solid var(--bdr); border-radius:4px; padding:14px; cursor:pointer; transition: all 0.2s; min-height:100px; display:flex; flex-direction:column; justify-content:center;}
.etf-item:active{transform:scale(0.96); opacity:0.7}
.etf-title{font-size:11px; font-weight:700; margin-bottom:8px; color:var(--blue); line-height:1.4; word-break:keep-all}
.etf-rank{font-size:10px; color:var(--gold); font-weight:700; margin-bottom:4px; letter-spacing:1px}
.n-stack{background:var(--bg3); border-left:3px solid var(--blue); padding:12px; margin-bottom:10px; border-radius:0 4px 4px 0}
.n-corp{font-size:9px; color:var(--blue); font-weight:900; margin-bottom:4px}
.savebtn{width:100%;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:4px;color:var(--green);font-weight:700;cursor:pointer;text-transform:uppercase}
#tabbar{display:flex;border-top:1px solid var(--bdr);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:18px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);border:none;background:transparent;}
.tb.act{color:var(--green); background:rgba(74,222,128,0.05)}
.screen{display:none; height:100%}.screen.act{display:block}
</style>
</head>
<body>

<div id="app">
  <div id="hdr">
    <div class="stabs">
      <button class="stab act" onclick="switchStock('samsung',this)">SEC (005930)</button>
      <button class="stab" onclick="switchStock('skhynix',this)">HYX (000660)</button>
    </div>
    <div onclick="openNaver(STOCKS[cur].code)">
      <div style="font-size:10px; color:var(--muted); letter-spacing:1px">REAL-TIME PRICE (NAVER) ↗</div>
      <span id="hPrice" class="h-price">₩-</span>
    </div>
  </div>

  <div id="content">
    <div id="screen-trade" class="screen act">
      <div class="die-card">
        <div style="font-size:9px;color:var(--muted);letter-spacing:1px">ALGO PREDICTION</div>
        <div style="font-size:16px; font-weight:700; color:var(--gold)">1st: UNICORN SK HYX Value Chain</div>
      </div>
      <div style="font-size:9px; color:var(--muted); margin-bottom:10px; font-weight:700; letter-spacing:1px">PORTFOLIO (TOUCH FOR LIVE DATA)</div>
      <div id="etf-list" class="etf-grid"></div>
      <button class="savebtn" onclick="runAI()">Gemini Portfolio Analysis ↗</button>
      <div id="aiRep" style="margin-top:16px; font-size:11px; color:var(--muted); line-height:1.7; border-left:2px solid var(--bg3); padding-left:14px"></div>
    </div>

    <div id="screen-news" class="screen">
      <div style="font-weight:700; margin-bottom:15px; letter-spacing:1px">TOP 10 SEMI NEWS (5+5)</div>
      <div id="news-list"></div>
    </div>

    <div id="screen-chat" class="screen">
      <div id="chat-logs" style="height:350px; overflow-y:auto; padding:10px"></div>
      <div style="display:flex; gap:8px; padding:10px; background:var(--bg2); border-radius:4px">
        <input type="text" id="chat-input" style="flex:1; background:transparent; border:none; color:#fff; outline:none" placeholder="비서에게 무엇이든 물어보세요." onkeypress="if(event.keyCode==13) sendChat()">
        <button onclick="sendChat()" style="color:var(--green); background:none; border:none; font-weight:700">SEND</button>
      </div>
    </div>

    <div id="screen-set" class="screen">
      <div class="die-card"><div style="font-size:9px; color:var(--muted)">GEMINI API KEY CONTROL</div><input type="password" id="geminiKey" class="savebtn" style="background:var(--bg3); text-align:left; color:#fff; border:none" placeholder="Enter API Key Here"></div>
      <button class="savebtn" onclick="saveAll()">System Config Save</button>
      <div style="text-align:center; margin-top:20px; font-size:10px; color:var(--muted)">CHIPBOT v5.6 | ROBUST AI READY</div>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb act" onclick="switchTab('trade',this)">CORE</button>
    <button class="tb" onclick="switchTab('news',this)">NEWS</button>
    <button class="tb" onclick="switchTab('chat',this)">CHAT</button>
    <button class="tb" onclick="switchTab('set',this)">SYS</button>
  </div>
</div>

<script>
const STOCKS = { samsung: { code:'005930', price: 218000 }, skhynix: { code:'000660', price: 1144000 } };

/* [UNICORN 코드 494220 최종 확인 완료] */
const ETFS = [
  { name: 'UNICORN SK하이닉스밸류체인액티브', code: '494220', rank: '1위' },
  { name: 'KODEX 반도체', code: '091160', rank: '2위' },
  { name: 'TIGER 코리아TOP10', code: '292150', rank: '3위' },
  { name: 'KODEX 200', code: '069500', rank: '4위' },
  { name: 'RISE 삼전하닉50혼합', code: '480310', rank: '5위' }
];

let cur = 'samsung';

function openNaver(code) { window.open(`https://m.stock.naver.com/domestic/stock/${code}/total`, '_blank'); }

function updateETFUI() {
  const list = document.getElementById('etf-list');
  list.innerHTML = ETFS.map(e => `
    <div class="etf-item" onclick="openNaver('${e.code}')">
      <div class="etf-rank">${e.rank}</div>
      <div class="etf-title">${e.name}</div>
      <div style="font-size:10px; color:var(--muted); margin-top:auto">실시간 시세 ↗</div>
    </div>
  `).join('');
}

async function loadDailyNews() {
  const list = document.getElementById('news-list');
  const k = localStorage.getItem('gemini_key');
  if(!k) { list.innerHTML = `<div style="padding:40px; text-align:center; color:var(--red);">[SYS] 탭에서 API 키를 입력해주세요.</div>`; return; }
  
  list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted)">AI가 뉴스를 스캔하고 있습니다...</div>`;
  const prompt = `삼성전자 뉴스 5개, 하이닉스 뉴스 5개를 요약해줘. 대답은 반드시 [ ]로 감싸진 JSON 리스트 형식이어야 해. 예: [{"corp":"SEC", "title":"제목", "sum":"내용"}]`;
  
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    const data = await res.json();
    
    // [강화] JSON 추출 로직: 텍스트 중 [ ] 구간만 정확히 찾아냄
    const rawText = data.candidates[0].content.parts[0].text;
    const jsonMatch = rawText.match(/\[[\s\S]*\]/);
    if(!jsonMatch) throw new Error("Format Error");
    
    const news = JSON.parse(jsonMatch[0]);
    list.innerHTML = news.map(n => `
      <div class="n-stack">
        <div class="n-corp">${n.corp}</div>
        <div style="font-size:12px; font-weight:700; margin-bottom:4px">${n.title}</div>
        <div style="font-size:11px; color:var(--muted); line-height:1.4">${n.sum}</div>
      </div>
    `).join('');
  } catch(e) { 
    list.innerHTML = `<div style="padding:20px; color:var(--red); font-size:11px; text-align:center;">
      연결 실패 또는 API 키 권한 부족.<br><br>
      1. API 키가 정확한지 확인<br>
      2. SYS 탭에서 재입력 후 저장<br>
      3. 잠시 후 다시 시도
    </div>`; 
  }
}

async function runAI() {
  const k = localStorage.getItem('gemini_key');
  if(!k) return;
  const prompt = `삼성전자 ₩218,000, 하이닉스 ₩1,144,000입니다. 현재 투자 전략을 로지님에게 100자 이내로 브리핑해줘.`;
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    const data = await res.json();
    document.getElementById('aiRep').textContent = data.candidates[0].content.parts[0].text;
  } catch(e){}
}

async function sendChat() {
  const i = document.getElementById('chat-input'), m = i.value; if(!m) return;
  addMsg('user', m); i.value = '';
  const k = localStorage.getItem('gemini_key');
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:`로지님의 비서입니다. 답변: ${m}`}]}]})
    });
    const d = await r.json(); addMsg('ai', d.candidates[0].content.parts[0].text);
  } catch(e){ addMsg('ai', "연결 실패."); }
}

function addMsg(t,s){ const l=document.getElementById('chat-logs'), d=document.createElement('div'); d.style = t==='ai' ? "background:var(--bg2); padding:12px; border-radius:4px; margin-bottom:12px; font-size:12px; line-height:1.6;" : "background:var(--green-bg); color:var(--green); padding:12px; border-radius:4px; margin-bottom:12px; font-size:12px; align-self:flex-end; border:1px solid var(--green);"; d.textContent=s; l.appendChild(d); l.scrollTop=l.scrollHeight; }

function switchStock(k,b){ document.querySelectorAll('.stab').forEach(s=>s.classList.remove('act')); b.classList.add('act'); cur=k; updateUI(); }
function switchTab(i,b){ 
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('act')); 
  document.querySelectorAll('.tb').forEach(t=>t.classList.remove('act')); 
  document.getElementById('screen-'+i).classList.add('act'); b.classList.add('act');
  if(i==='news') loadDailyNews();
}
function updateUI(){ document.getElementById('hPrice').textContent=`₩${STOCKS[cur].price.toLocaleString()}`; }
function saveAll(){ localStorage.setItem('gemini_key', document.getElementById('geminiKey').value); alert('System Saved Successfully.'); }
function init(){ updateUI(); updateETFUI(); document.getElementById('geminiKey').value=localStorage.getItem('gemini_key')||""; }
init();
</script>
</body>
</html>
