<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChipBot v3.8 Pro</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChipBot">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2533/2533031.png">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10;--bg2:#13161b;--bg3:#1a1e25;
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.13);
  --txt:#dddbd6;--muted:#6b6966;--hint:#3a3836;
  --green:#4ade80;--green-bg:rgba(74,222,128,.07);--green-bd:#166534;
  --red:#f87171;--red-bg:rgba(248,113,113,.07);--red-bd:#991b1b;
  --blue:#60a5fa;--font:'JetBrains Mono',monospace;
  --r:10px;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto; background:var(--bg)}

/* Header */
#hdr{padding:16px 16px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0; padding-top:calc(16px + env(safe-area-inset-top))}
.stabs{display:flex;gap:6px;margin-bottom:10px}
.stab{padding:6px 14px;border:1px solid var(--bdr2);border-radius:var(--r);font-size:11px;color:var(--muted);background:transparent;cursor:pointer}
.stab.act{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.h-price{font-size:32px;font-weight:700;letter-spacing:-.03em}

/* Content Area */
#content{flex:1;overflow-y:auto;padding:16px; scrollbar-width:none;}
#content::-webkit-scrollbar{display:none}

/* News UI */
.n-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px}
.n-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:6px;display:inline-block;text-transform:uppercase}
.tag-pos{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.tag-neg{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.tag-neu{background:var(--bg3);color:var(--muted);border:1px solid var(--bdr2)}
.n-title{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:6px}
.n-sum{font-size:11px;color:var(--muted);line-height:1.5}

/* Metrics & General */
.mc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mv{font-size:22px;font-weight:700}
#chat-logs{height:300px;overflow-y:auto;margin-bottom:12px;padding:12px;background:var(--bg3);border-radius:var(--r);display:flex;flex-direction:column}
.msg{margin-bottom:12px;max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.6}
.msg.ai{background:var(--bg2);color:var(--txt);align-self:flex-start;border:1px solid var(--bdr)}
.msg.user{background:var(--green-bg);color:var(--green);align-self:flex-end;border:1px solid var(--green-bd)}
#chat-input-area{display:flex;gap:10px;background:var(--bg2);padding:10px;border-radius:12px;border:1px solid var(--bdr)}
#chat-input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:13px}

.savebtn{width:100%;padding:15px;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r);color:var(--green);font-weight:700;font-size:13px;margin-top:10px;cursor:pointer}
.apii{width:100%;background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--r);color:#fff;padding:12px;margin-top:8px;outline:none}

/* Tabbar */
#tabbar{display:flex;border-top:1px solid var(--bdr);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:16px 4px;text-align:center;font-size:10px;color:var(--muted);border:none;background:transparent}
.tb.act{color:var(--green);border-top:2px solid var(--green);margin-top:-1px}

.screen{display:none; height:100%}.screen.act{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="stabs">
      <button class="stab act" onclick="switchStock('samsung',this)">삼성전자</button>
      <button class="stab" onclick="switchStock('skhynix',this)">SK하이닉스</button>
    </div>
    <div id="hPrice" class="h-price">₩-</div>
  </div>

  <div id="content">
    <div id="screen-trade" class="screen act">
      <div class="mc"><div style="font-size:10px;color:var(--muted)">Wilder's RSI</div><div class="mv" id="rsiV">-</div></div>
      <div class="mc"><div style="height:180px"><canvas id="pc"></canvas></div></div>
      <button class="savebtn" onclick="runAI()">Gemini 분석 & 노션 기록 ↗</button>
      <div id="aiRep" style="margin-top:12px; font-size:11px; color:var(--muted); line-height:1.6"></div>
    </div>

    <div id="screen-news" class="screen">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
        <span style="font-weight:700">Daily Top 10 News</span>
        <button class="btn" onclick="loadDailyNews()" style="font-size:10px; color:var(--blue); background:none; border:none">새로고침 ↻</button>
      </div>
      <div id="news-list">
        <div style="text-align:center; padding:40px; color:var(--hint)">뉴스를 불러오는 중...</div>
      </div>
    </div>

    <div id="screen-chat" class="screen">
      <div id="chat-logs"></div>
      <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Gemini에게 질문하기..." onkeypress="if(event.keyCode==13) sendChat()">
        <button onclick="sendChat()" style="color:var(--green);background:none;border:none;font-weight:700">전송</button>
      </div>
    </div>

    <div id="screen-set" class="screen">
      <div class="mc"><div style="font-size:10px;color:var(--muted)">GEMINI API KEY</div><input class="apii" type="password" id="geminiKey"></div>
      <div class="mc"><div style="font-size:10px;color:var(--muted)">NOTION API SETTINGS</div><input class="apii" type="password" id="notionKey" placeholder="Secret Key"><input class="apii" type="text" id="notionDbId" placeholder="Database ID"></div>
      <button class="savebtn" onclick="saveAll()">설정 저장</button>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb act" onclick="switchTab('trade',this)">지표</button>
    <button class="tb" onclick="switchTab('news',this)">뉴스</button>
    <button class="tb" onclick="switchTab('chat',this)">채팅</button>
    <button class="tb" onclick="switchTab('set',this)">설정</button>
  </div>
</div>

<script>
const STOCKS = { samsung: { name:'삼성전자', lastClose: 218000, prevClose: 216000 }, skhynix: { name:'SK하이닉스', lastClose: 1144000, prevClose: 1128000 } };
let cur = 'samsung', pH = {samsung:[], skhynix:[]}, pChart;

function calcRSI(p, n=14){
  if(p.length<n+1) return 50;
  let g=[], l=[]; for(let i=1;i<p.length;i++){ const d=p[i]-p[i-1]; g.push(d>0?d:0); l.push(d<0?-d:0); }
  let ag=g.slice(0,n).reduce((a,b)=>a+b)/n, al=l.slice(0,n).reduce((a,b)=>a+b)/n;
  for(let i=n;i<g.length;i++){ ag=(ag*(n-1)+g[i])/n; al=(al*(n-1)+l[i])/n; }
  return al===0?100:parseFloat((100-(100/(1+ag/al))).toFixed(1));
}

async function callGemini(p){
  const k=localStorage.getItem('gemini_key'); if(!k) return "ERROR: API KEY MISSING";
  try {
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:p}]}]})
    });
    const d=await r.json(); return d.candidates[0].content.parts[0].text;
  } catch(e){ return "연결 실패"; }
}

/* ── [신규] 뉴스 로드 및 렌더링 ── */
async function loadDailyNews() {
  const list = document.getElementById('news-list');
  list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted)">제미나이가 오늘 뉴스를 분석 중입니다...</div>`;
  
  const prompt = `오늘 날짜 기준 ${STOCKS[cur].name} 주가에 영향을 줄만한 핵심 뉴스 10개를 검색해서 요약해줘. 
  반드시 다음 JSON 형식으로만 대답해: [{"title":"제목", "sum":"2문장 요약", "impact":"positive|negative|neutral"}]`;
  
  const res = await callGemini(prompt);
  try {
    const jsonStr = res.match(/\[.*\]/s)[0];
    const news = JSON.parse(jsonStr);
    list.innerHTML = news.map(n => `
      <div class="n-card">
        <span class="n-tag ${n.impact === 'positive' ? 'tag-pos' : n.impact === 'negative' ? 'tag-neg' : 'tag-neu'}">${n.impact}</span>
        <div class="n-title">${n.title}</div>
        <div class="n-sum">${n.sum}</div>
      </div>
    `).join('');
  } catch(e) { list.innerHTML = `<div style="padding:20px; color:var(--red)">뉴스를 파싱하는 데 실패했습니다. 잠시 후 다시 시도해주세요.</div>`; }
}

async function sendChat(){
  const i=document.getElementById('chat-input'), m=i.value; if(!m) return;
  addMsg('user', m); i.value='';
  const res=await callGemini(`로지님의 비서입니다. 종목:${STOCKS[cur].name}, 가격:${STOCKS[cur].lastClose}, 질문:${m}`);
  addMsg('ai', res);
}

function addMsg(t,s){ const l=document.getElementById('chat-logs'), d=document.createElement('div'); d.className=`msg ${t}`; d.textContent=s; l.appendChild(d); l.scrollTop=l.scrollHeight; }

async function runAI(){
  const s = STOCKS[cur], r = calcRSI(pH[cur]);
  const res = await callGemini(`${s.name} 가격:${s.lastClose}, RSI:${r} 분석해줘.`);
  document.getElementById('aiRep').textContent = res;
  sendToNotion(s.name, s.lastClose, r, res);
}

async function sendToNotion(n,p,r,s){
  const k=localStorage.getItem('notion_key'), d=localStorage.getItem('notion_db_id'); if(!k||!d) return;
  try { await fetch("https://corsproxy.io/?"+encodeURIComponent("https://api.notion.com/v1/pages"),{
    method:'POST',headers:{'Authorization':`Bearer ${k}`,'Content-Type':'application/json','Notion-Version':'2022-06-28'},
    body:JSON.stringify({parent:{database_id:d},properties:{"종목명":{title:[{text:{content:n}}]},"가격":{number:p},"수익률":{rich_text:[{text:{content:`RSI:${r}`}}]},"기록시간":{date:{start:new Date().toISOString()}}}})
  }); } catch(e){}
}

function saveAll(){
  localStorage.setItem('gemini_key',document.getElementById('geminiKey').value);
  localStorage.setItem('notion_key',document.getElementById('notionKey').value);
  localStorage.setItem('notion_db_id',document.getElementById('notionDbId').value);
  alert('설정 완료!');
}

function updateUI(){
  const s = STOCKS[cur]; document.getElementById('hPrice').textContent=`₩${s.lastClose.toLocaleString()}`;
  document.getElementById('rsiV').textContent = calcRSI(pH[cur]);
  if(!pChart){
    pChart=new Chart(document.getElementById('pc'),{ type:'line', data:{labels:pH[cur].map((_,i)=>i),datasets:[{data:pH[cur],borderColor:'#f87171',borderWidth:2,pointRadius:0}]}, options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{grid:{color:'rgba(255,255,255,0.05)'}}}});
  } else { pChart.data.datasets[0].data=pH[cur]; pChart.update(); }
}

function switchStock(k,b){ document.querySelectorAll('.stab').forEach(s=>s.classList.remove('act')); b.classList.add('act'); cur=k; updateUI(); loadDailyNews(); }
function switchTab(i,b){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('act')); document.querySelectorAll('.tb').forEach(t=>t.classList.remove('act')); document.getElementById('screen-'+i).classList.add('act'); b.classList.add('act'); if(i==='news') loadDailyNews(); }

function init(){
  ['samsung','skhynix'].forEach(k=>{
    let v = STOCKS[k].prevClose; for(let i=0;i<30;i++){ v+=(Math.random()-0.5)*2000; pH[k].push(Math.round(v)); }
    pH[k][pH[k].length-1] = STOCKS[k].lastClose;
  });
  updateUI();
  document.getElementById('geminiKey').value=localStorage.getItem('gemini_key')||"";
  document.getElementById('notionKey').value=localStorage.getItem('notion_key')||"";
  document.getElementById('notionDbId').value=localStorage.getItem('notion_db_id')||"";
}
init();
</script>
</body>
</html>
