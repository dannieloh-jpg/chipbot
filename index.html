<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChipBot v4.7 - Live Sync</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChipBot">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2533/2533031.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d10; --bg2:#13161b; --bg3:#1a1e25;
  --bdr:rgba(255,255,255,.08); --txt:#dddbd6; --muted:#6b6966;
  --green:#4ade80; --green-bg:rgba(74,222,128,.1);
  --red:#f87171; --blue:#60a5fa; --gold:#fbbf24;
  --font:'Inter', sans-serif; --mono:'JetBrains Mono', monospace;
}

html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto; background:rgba(11,13,16,0.98); backdrop-filter:blur(15px)}

/* Splash */
#splash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items:center;
  z-index: 10000; transition: opacity 0.8s;
}
#splash.hidden { opacity: 0; visibility: hidden; }

/* Header */
#hdr{padding:20px 16px 12px; border-bottom:1px solid var(--bdr); flex-shrink:0; padding-top:calc(20px + env(safe-area-inset-top))}
.stabs{display:flex;gap:6px;margin-bottom:12px; overflow-x:auto; scrollbar-width:none;}
.stab{padding:6px 16px; border:1px solid var(--bdr); border-radius:4px; font-size:11px; font-weight:600; color:var(--muted); background:var(--bg2); white-space:nowrap; cursor:pointer;}
.stab.act{border-color:var(--green); color:var(--green); background:var(--green-bg)}

.h-price-wrap{display:flex; align-items:center; gap:10px; cursor:pointer;}
.h-price{font-size:36px;font-weight:700;letter-spacing:-.04em;font-family:var(--mono)}
.live-dot{width:8px; height:8px; background:var(--green); border-radius:50%; animation: pulse 1.5s infinite;}

/* Content */
#content{flex:1;overflow-y:auto;padding:16px; scrollbar-width:none;}
#content::-webkit-scrollbar{display:none}

.die-card{
  background:var(--bg2); border:1px solid var(--bdr); border-left:4px solid var(--muted);
  border-radius:4px; padding:16px; margin-bottom:12px;
}
.die-label{font-size:9px;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; display:flex; justify-content:space-between}

/* ETF Item - Clickable */
.etf-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.etf-item{
  background:var(--bg3); border:1px solid var(--bdr); border-radius:4px; padding:14px;
  cursor:pointer; transition: all 0.2s; position:relative;
}
.etf-item:active{transform:scale(0.96); background:var(--bg2)}
.etf-title{font-size:11px; font-weight:700; margin-bottom:6px; color:var(--blue); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.etf-price{font-size:16px; font-weight:700; margin-bottom:6px; font-family:var(--mono)}
.etf-status{font-size:9px; color:var(--green); font-weight:700}

.savebtn{width:100%;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:4px;color:var(--green);font-weight:700;text-transform:uppercase; cursor:pointer}
#tabbar{display:flex;border-top:1px solid var(--bdr);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;padding:18px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);border:none;background:transparent;}
.tb.act{color:var(--green); background:rgba(74,222,128,0.05)}

.screen{display:none; height:100%}.screen.act{display:block}

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div id="splash">
  <div style="width:250px; height:250px; border:2px solid var(--green); border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; box-shadow:0 0 30px var(--green-bg)">
    <div style="font-family:var(--mono); color:var(--green); font-size:20px; font-weight:900;">LIVE DATA BUS</div>
    <div style="color:var(--muted); font-size:10px; margin-top:10px;">FETCHING YAHOO FINANCE...</div>
  </div>
</div>

<div id="app">
  <div id="hdr">
    <div class="stabs">
      <button class="stab act" onclick="switchStock('samsung',this)">SEC (005930)</button>
      <button class="stab" onclick="switchStock('skhynix',this)">HYX (000660)</button>
    </div>
    <div class="h-price-wrap" id="headerKiwoomLink">
      <span class="live-dot"></span>
      <span id="hPrice" class="h-price">₩-</span>
    </div>
  </div>

  <div id="content">
    <div id="screen-trade" class="screen act">
      <div class="die-card"><div class="die-label"><span>Wilder's RSI (14D)</span><span id="updateTime" style="color:var(--blue)">LIVE</span></div><div class="die-val" id="rsiV">-</div></div>
      
      <div class="die-label">Real-time Portfolios (Touch for Kiwoom S#)</div>
      <div id="etf-list" class="etf-grid"></div>

      <button class="savebtn" onclick="syncAllPrices()">Manual Refresh ↻</button>
      <div id="aiRep" style="margin-top:16px; font-size:11px; color:var(--muted); line-height:1.7; border-left:2px solid var(--bg3); padding-left:14px"></div>
    </div>
    <div id="screen-news" class="screen"><div id="news-list"></div></div>
    <div id="screen-chat" class="screen">
      <div id="chat-logs" style="height:300px; overflow-y:auto; padding:10px"></div>
      <input type="text" id="chat-input" class="savebtn" style="background:var(--bg3); text-align:left; color:#fff" placeholder="질문..." onkeypress="if(event.keyCode==13) sendChat()">
    </div>
    <div id="screen-set" class="screen">
      <input type="password" id="geminiKey" class="savebtn" style="background:var(--bg3); text-align:left; color:#fff" placeholder="Gemini Key">
      <button class="savebtn" onclick="saveAll()">Save System</button>
    </div>
  </div>

  <div id="tabbar">
    <button class="tb act" onclick="switchTab('trade',this)">LIVE</button>
    <button class="tb" onclick="switchTab('news',this)">NEWS</button>
    <button class="tb" onclick="switchTab('chat',this)">CHAT</button>
    <button class="tb" onclick="switchTab('set',this)">SYS</button>
  </div>
</div>

<script>
/* ── [핵심] 야후 파이낸스 티커 및 종목코드 ── */
const STOCKS = {
  samsung: { name:'삼성전자', code:'005930', ticker:'005930.KS', price: 218000 },
  skhynix: { name:'SK하이닉스', code:'000660', ticker:'000660.KS', price: 1144000 }
};

const ETFS = [
  { name: 'KODEX 200', code: '069500', ticker: '069500.KS', price: 112450 },
  { name: 'KODEX 반도체', code: '091160', ticker: '091160.KS', price: 68900 },
  { name: 'TIGER 코리아TOP10', code: '292150', ticker: '292150.KS', price: 32600 },
  { name: 'UNICORN HYX밸류', code: '466920', ticker: '466920.KS', price: 28400 },
  { name: 'RISE 삼전하닉50', code: '480310', ticker: '480310.KS', price: 18750 }
];

let cur = 'samsung', pH = {samsung:[], skhynix:[]};

/* [기능] 야후 파이낸스 실시간 가격 Fetch */
async function fetchLivePrice(ticker) {
  try {
    const proxy = "https://corsproxy.io/?";
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1m&range=1d`;
    const res = await fetch(proxy + encodeURIComponent(url));
    const data = await res.json();
    const price = data.chart.result[0].indicators.quote[0].close.slice(-1)[0] || data.chart.result[0].meta.regularMarketPrice;
    return Math.round(price);
  } catch(e) {
    console.log(`Failed to fetch ${ticker}, using fallback.`);
    return null; 
  }
}

async function syncAllPrices() {
  document.getElementById('updateTime').textContent = "FETCHING...";
  
  // 메인 종목 업데이트
  for (let key in STOCKS) {
    const live = await fetchLivePrice(STOCKS[key].ticker);
    if(live) STOCKS[key].price = live;
  }
  
  // ETF 업데이트
  for (let etf of ETFS) {
    const live = await fetchLivePrice(etf.ticker);
    if(live) etf.price = live;
  }
  
  updateUI();
  updateETFUI();
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
}

function openKiwoom(code) {
  // 키움증권 모바일웹 다이렉트 주소
  const kiwoomUrl = `https://m.kiwoom.com/m/invest/stock/investStockQuote?code=${code}`;
  window.open(kiwoomUrl, '_blank');
}

function updateETFUI() {
  const list = document.getElementById('etf-list');
  list.innerHTML = ETFS.map(e => `
    <div class="etf-item" onclick="openKiwoom('${e.code}')">
      <div class="etf-title">${e.name}</div>
      <div class="etf-price">₩${e.price.toLocaleString()}</div>
      <div class="etf-status">● LIVE DATA</div>
    </div>
  `).join('');
}

function updateUI(){
  const s = STOCKS[cur]; 
  document.getElementById('hPrice').textContent=`₩${s.price.toLocaleString()}`;
  document.getElementById('headerKiwoomLink').onclick = () => openKiwoom(s.code);
  
  // RSI는 실시간 가격 기반으로 모킹된 데이터에 마지막 가격 주입하여 계산
  const mockPrices = [...pH[cur]];
  mockPrices[mockPrices.length-1] = s.price;
  document.getElementById('rsiV').textContent = calcRSI(mockPrices);
}

function calcRSI(p, n=14){
  if(p.length < n+1) return 50;
  let g=[], l=[]; for(let i=1;i<p.length;i++){ const d=p[i]-p[i-1]; g.push(d>0?d:0); l.push(d<0?-d:0); }
  let ag=g.slice(0,n).reduce((a,b)=>a+b)/n, al=l.slice(0,n).reduce((a,b)=>a+b)/n;
  for(let i=n; i<g.length; i++){ ag=(ag*(n-1)+g[i])/n; al=(al*(n-1)+l[i])/n; }
  return al===0?100:parseFloat((100-(100/(1+ag/al))).toFixed(1));
}

function switchStock(k,b){ document.querySelectorAll('.stab').forEach(s=>s.classList.remove('act')); b.classList.add('act'); cur=k; updateUI(); }
function switchTab(i,b){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('act')); document.querySelectorAll('.tb').forEach(t=>t.classList.remove('act')); document.getElementById('screen-'+i).classList.add('act'); b.classList.add('act'); }
function saveAll(){ localStorage.setItem('gemini_key', document.getElementById('geminiKey').value); alert('SYSTEM UPDATED'); }

async function init(){
  // 차트용 모킹 데이터 생성
  ['samsung','skhynix'].forEach(k=>{
    let v = STOCKS[k].price * 0.95; for(let i=0;i<30;i++){ v+=(Math.random()-0.5)*2000; pH[k].push(Math.round(v)); }
  });
  
  updateUI(); 
  updateETFUI();
  
  // 초기 1회 실시간 동기화
  await syncAllPrices();
  
  document.getElementById('geminiKey').value=localStorage.getItem('gemini_key')||"";
  setTimeout(() => document.getElementById('splash').classList.add('hidden'), 2000);
}
init();
</script>
</body>
</html>
